<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Log in or Sign up</title>
</head>
<body>
    <div class="form">
        <div class="container">
            <p class="textHeader">Log in</p>
            <div class="container-1">
                <input class="email" type="email" placeholder="Email" required>
                <input class="password" type="password" placeholder="Password" required>
            </div>
            <div class="container-2">
                <button class="btnLogin" onclick="login()">Log in</button>
            </div>
            <div class="container-3">
                <p class="error-msg"></p>
                <p class="text1">Don't have an account? <a href="index.html">Create Account</a></p>
            </div>
        </div>
    </div>

<script src="user.js"></script>
<script src="getUser.js"></script>
</body>
</html>
