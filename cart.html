<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cart.css">
    <title>Cart</title>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <a href="home.html"><img class="img-logo" src="images/pictures/shopping-cart.gif" alt="logo"></a>
        </div>
        <ul>
            <a class="a" href="account.html"><li>Account</li></a>
            <a class="a" href="home.html"><li>Home</li></a>
            <a class="a" href="shop.html"><li>Shop now</li></a>
            
        </ul>
        <div class="cart-container">
            <p style="color: rgb(232, 81, 0);" class="cart-quantity">0</p>
            <a class="a" href="cart.html"><li><img class="cart-img" src="images/pictures/shopping-bag.png" alt="cart"></li></a>
        </div>
    </nav>

    <div class="container">
        <h1>My Cart <img src="images/pictures/shopping-bag.png" width="30px" alt="cart-img"></h1>
        <div class="container-1">
            <div class="cart-summary">
                <div class="item-image">
                    <img class="item-img" src="https://www.sony.com.ph/image/6ff70f66ce935f02861635b3e936a70c?fmt=pjpeg&wid=330&bgcolor=FFFFFF&bgc=FFFFFF" alt="product-image">
                </div>

                <div class="product-name">
                    <p class="item-name">Wireless Bluetooth Earbuds</p>
                </div>

                <div class="item-price">
                    <p class="item-price">8999</p>
                </div>
            </div>

            <div class="item-remove-container">
                <button class="update">Add</button>
                <button class="remove">Remove</button>
            </div>

            <div class="cart-radio">
                <input type="radio" name="item-product" id="item1">
                <label for="item1">Self Pickup</label>

                <input type="radio" name="item-product" id="item2">
                <label for="item2">Cash on Delivery</label>
            </div>

            <div class="cart-checkout">
                <button class="checkoutBtn">Checkout</button>
            </div>
        </div>
    </div>
</body>
</html>
